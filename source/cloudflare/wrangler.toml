name = "steamlite-online"
main = "src/worker.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "steamlite-online"
# deploy.ps1 fills this in after the database is created
database_id = "96c44286-19fd-4bd7-91b0-697d6f3e728d"

[triggers]
# every hour: sale alerts for wishlist games (prices are re-checked 4 times a day). At 17:00 UTC: friend streak reminders
crons = ["0 * * * *"]
