<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>SteamLite session</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  .card { margin: 4px; height: calc(100% - 8px); box-sizing: border-box; padding: 10px 14px; border-radius: 14px; background: rgba(14, 14, 22, 0.86); border: 1px solid rgba(255, 255, 255, 0.14); color: #fff; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); }
  .name { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .time { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock { font-size: 12px; color: rgba(255, 255, 255, 0.55); font-variant-numeric: tabular-nums; }
  .nudge { margin-top: 2px; font-size: 11px; color: #fbbf24; display: none; }
  .nudge.on { display: block; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
</style>
</head>
<body>
<div class="card">
  <div class="name" id="n">Game</div>
  <div class="row"><div class="time" id="t">00:00:00</div><div class="clock" id="c"></div></div>
  <div class="nudge" id="b">Time for a break?</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const start = Number(q.get('start')) || Date.now();
  const brk = Number(q.get('brk')) || 0;
  document.getElementById('n').textContent = q.get('name') || 'Game';
  const p2 = (n) => String(n).padStart(2, '0');
  function tick() {
    const s = Math.max(0, Math.floor((Date.now() - start) / 1000));
    document.getElementById('t').textContent = p2(Math.floor(s / 3600)) + ':' + p2(Math.floor(s % 3600 / 60)) + ':' + p2(s % 60);
    const d = new Date();
    document.getElementById('c').textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
    // the break nudge shows for the first minute after every break interval
    if (brk > 0) { const m = s / 60, into = m % brk; document.getElementById('b').classList.toggle('on', m >= brk && into < 1); }
  }
  tick(); setInterval(tick, 1000);
</script>
</body>
</html>
